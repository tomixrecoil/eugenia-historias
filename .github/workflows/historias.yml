name: Historias
# Cada reel publicado sale como historia con sticker de enlace, en su cuenta (18/11/2026).
# Los reels salen a las 6:00 y 18:00 ART (uno por cuenta, cada 10 min). Corre 45 min
# después y de nuevo 2 h más tarde por si algo falló o GitHub se demoró.
on:
  schedule:
    # Cada 15 min (19/11, Tomix: "cada vez que se sube 1 reel, que se suba de historia").
    # Sin pendientes termina en segundos y no prende el emulador.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      cada_cuenta:
        description: "Subir el último reel de cada cuenta que no tenga historia de las últimas 24 h"
        type: boolean
        default: false
      solo:
        description: "Solo esta cuenta (hidroponia, bonsai, terrarios, herbologia): su último reel, ya"
        type: string
        default: ""
      gpu:
        description: "Gráficos del emulador (vacío = guest, el normal desde el 22/11; swiftshader_indirect = el viejo, se cae al abrir Instagram)"
        type: string
        default: ""
      modo:
        description: "todas = último reel de cada cuenta, tenga o no historia; sin-publicar = prueba de 1 cuenta sin publicar"
        type: choice
        options: ["", "todas", "sin-publicar"]
        default: ""

concurrency:
  group: historias
  cancel-in-progress: false

jobs:
  historias:
    runs-on: ubuntu-latest
    # 22/11: modo guest (gráficos dentro de Android): no se cae como swiftshader, pero es
    # mucho más lento. Tope de GitHub: 360 min.
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      EMU_GPU: ${{ inputs.gpu }}
      PUERTA_R2_URL: ${{ secrets.PUERTA_R2_URL }}
      PUERTA_R2_KEY: ${{ secrets.PUERTA_R2_KEY }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      ANDROID_AVD_HOME: /mnt/avd
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay historias pendientes?
        id: pend
        run: |
          python3 historias_nube.py --probar ${{ inputs.cada_cuenta && '--cada-cuenta' || '' }} ${{ inputs.modo && format('--{0}', inputs.modo) || '' }} ${{ inputs.solo && format('--solo={0}', inputs.solo) || '' }} | tee probar.txt
          n=$(grep -oP 'pendientes: \K\d+' probar.txt || echo 0)
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: KVM y espacio
        if: steps.pend.outputs.n != '0'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          sudo mkdir -p /mnt/avd && sudo chown -R "$USER" /mnt/avd
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q pillow
          df -h / /mnt

      - name: Imagen de Android (cache)
        if: steps.pend.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-34/google_apis_playstore/x86_64
            /usr/local/lib/android/sdk/emulator
          key: android34-playstore-x86_64-v1

      - name: Instalar emulador e imagen
        if: steps.pend.outputs.n != '0'
        run: |
          SM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SM --licenses >/dev/null || true
          [ -d "$ANDROID_SDK_ROOT/system-images/android-34/google_apis_playstore/x86_64" ] || \
            $SM "system-images;android-34;google_apis_playstore;x86_64" >/dev/null
          [ -x "$ANDROID_SDK_ROOT/emulator/emulator" ] || $SM "emulator" >/dev/null
          $SM "platform-tools" >/dev/null
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Armar el emulador (copia cifrada del de la PC)
        if: steps.pend.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EMU_CLAVE: ${{ secrets.EMU_CLAVE }}
        run: |
          D=/mnt/avd/eugenia_ig.avd; mkdir -p $D /mnt/avd/dl
          gh release download avd-cifrado -R ${{ github.repository }} -D /mnt/avd/dl
          des() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:EMU_CLAVE -in "$1"; }
          # Todas las partes, en orden (21/11: la imagen creció a 4 partes y se usaban solo 3)
          for f in $(ls /mnt/avd/dl/userdata.part*.enc | sort); do des $f; done > $D/userdata-qemu.img
          rm -f /mnt/avd/dl/userdata.part*
          des /mnt/avd/dl/avd-chico.tgz.enc | tar -xz -C $D
          sed -i 's#\\#/#g' $D/config.ini
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-34\n' "$D" > /mnt/avd/eugenia_ig.ini
          ls -la $D

      - name: Prender el emulador
        if: steps.pend.outputs.n != '0'
        timeout-minutes: 40
        env:
          ADB_KEY: ${{ secrets.ADB_KEY }}
          ADB_KEY_PUB: ${{ secrets.ADB_KEY_PUB }}
        run: |
          ls -la /dev/kvm || true
          # La clave de adb de la PC: el Android de la copia solo acepta esa (si no: "unauthorized")
          mkdir -p ~/.android
          printf '%s\n' "$ADB_KEY" > ~/.android/adbkey
          printf '%s\n' "$ADB_KEY_PUB" > ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey
          adb kill-server || true
          adb start-server
          nohup emulator -avd eugenia_ig -no-window -no-audio -no-boot-anim -no-snapshot -gpu ${EMU_GPU:-guest} -memory 4096 -cores 4 -accel on > emulador.log 2>&1 &
          ok=0
          for i in $(seq 1 120); do
            st=$(adb devices | grep emulator | awk '{print $2}')
            b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -dc '0-9')
            [ $((i % 6)) = 0 ] && echo "$(date +%T) adb=$st boot=$b | $(tail -1 emulador.log | cut -c1-120)"
            [ "$b" = "1" ] && ok=1 && break
            sleep 10
          done
          adb exec-out screencap -p > falla_arranque.png 2>/dev/null || true
          [ $ok = 1 ] || { echo "no terminó de arrancar"; tail -40 emulador.log; exit 1; }
          rm -f falla_arranque.png
          sleep 20
          adb shell input keyevent 82
          # Teclado ADB (github.com/senzhk/ADBKeyBoard, 18/11): emojis y tildes en el sticker
          adb install -r apk/adbkeyboard.apk || true
          # Recién instalado tarda unos segundos en registrarse como teclado
          for i in $(seq 1 12); do
            adb shell ime enable com.android.adbkeyboard/.AdbIME 2>/dev/null | grep -q "now enabled\|already enabled" && break
            sleep 5
          done
          adb shell ime set com.android.adbkeyboard/.AdbIME || echo "aviso: sin teclado ADB, el botón sale sin emoji"

      - name: Historias
        if: steps.pend.outputs.n != '0'
        run: python3 historias_nube.py ${{ inputs.cada_cuenta && '--cada-cuenta' || '' }} ${{ inputs.modo && format('--{0}', inputs.modo) || '' }} ${{ inputs.solo && format('--solo={0}', inputs.solo) || '' }}

      - name: Guardar el emulador en la nube
        # 21/11: si en esta corrida subió alguna historia o se cargó un código, la copia del
        # emulador se guarda tal como quedó: Instagram ve siempre el mismo celular (sin la PC).
        # Si la copia nueva no pasa el chequeo (qemu-img check), no se sube y queda la anterior.
        # APAGADO 22/11 (Tomix: "sin que recuerde el emulador"): rompió la copia de la nube.
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
          EMU_CLAVE: ${{ secrets.EMU_CLAVE }}
        run: |
          set -e
          adb emu kill || true
          sleep 20; pkill -f qemu-system || true; sleep 5
          D=/mnt/avd/eugenia_ig.avd; O=/mnt/avd/nuevo; mkdir -p $O
          Q=$ANDROID_SDK_ROOT/emulator/qemu-img
          ls -la $D
          src=$D/userdata-qemu.img; [ -f $D/userdata-qemu.img.qcow2 ] && src=$D/userdata-qemu.img.qcow2
          $Q convert -c -O qcow2 $src $O/userdata-qemu.img
          $Q check $O/userdata-qemu.img
          cd $O && split -b 1992294400 -d -a 1 userdata-qemu.img userdata.part && rm userdata-qemu.img
          for f in userdata.part?; do openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:EMU_CLAVE -in $f -out $f.enc; rm $f; done
          for a in $(gh release view avd-cifrado -R ${{ github.repository }} --json assets -q '.assets[].name' | grep '^userdata.part'); do
            [ -f "$a" ] || gh release delete-asset avd-cifrado "$a" -R ${{ github.repository }} -y; done
          gh release upload avd-cifrado -R ${{ github.repository }} --clobber userdata.part?.enc
          echo "copia validada subida"

      - name: Guardar lo hecho
        if: always()
        run: |
          git config user.name "eugenia-historias"
          git config user.email "eugenia-historias@users.noreply.github.com"
          # 21/11: si alguien cambió estado.json mientras corría (pausas, código), se fusiona:
          # lo de esta corrida (hechas, fallas, textos, pausa_hasta) sobre lo último del repo.
          cp estado.json /tmp/mio.json
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - <<'P'
          import json
          m = json.load(open("/tmp/mio.json", encoding="utf-8"))
          r = json.load(open("estado.json", encoding="utf-8"))
          for k in ("hechas", "fallas", "textos", "pausa_hasta"):
              r.setdefault(k, {}).update(m.get(k, {}))
          r["desde"] = r.get("desde") or m.get("desde")
          json.dump(r, open("estado.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          P
            git add estado.json
            git diff --cached --quiet && break
            git commit -q -m "historias $(date -u +%F' '%H:%M)" && git push -q && break
            sleep 5
          done

      - name: Capturas y log cifrados (el repo es publico)
        if: always()
        env:
          EMU_CLAVE: ${{ secrets.EMU_CLAVE }}
        run: |
          ls emulador.log falla_*.png editor_*.png 2>/dev/null | grep -q . || exit 0
          # 20/11: el emulador se cerraba a mitad de la corrida sin dejar rastro. Esto guarda por qué
          # (el sistema matando procesos por memoria, o el crash de Android) junto al log del emulador.
          { echo "==== dmesg"; sudo dmesg 2>/dev/null | grep -iE "killed process|out of memory|oom|qemu" | tail -20;
            echo "==== logcat crash"; timeout 20 adb logcat -b crash -d 2>/dev/null | tail -60;
            echo "==== procesos"; ps aux --sort=-%mem | head -8; free -m; } >> emulador.log 2>&1 || true
          cp /tmp/android-runner/emu-crash-*.db/*/*.dmp . 2>/dev/null || true
          ls -R /tmp/android-runner 2>/dev/null | tail -20 >> emulador.log || true
          tar -czf diag.tgz $(ls falla_*.png editor_*.png *.dmp 2>/dev/null) emulador.log || tar -czf diag.tgz emulador.log
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:EMU_CLAVE -in diag.tgz -out diag.tgz.enc
          rm -f diag.tgz falla_*.png editor_*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ github.run_id }}
          path: diag.tgz.enc
          retention-days: 7
          if-no-files-found: ignore
