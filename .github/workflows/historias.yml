name: Historias
# Cada reel publicado sale como historia con sticker de enlace, en su cuenta (18/11/2026).
# Los reels salen a las 6:00 y 18:00 ART (uno por cuenta, cada 10 min). Corre 45 min
# después y de nuevo 2 h más tarde por si algo falló o GitHub se demoró.
on:
  schedule:
    - cron: "45 9 * * *"     # 06:45 ART
    - cron: "45 11 * * *"    # 08:45 ART (repaso)
    - cron: "45 21 * * *"    # 18:45 ART
    - cron: "45 23 * * *"    # 20:45 ART (repaso)
  workflow_dispatch:

concurrency:
  group: historias
  cancel-in-progress: false

jobs:
  historias:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    env:
      PUERTA_R2_URL: ${{ secrets.PUERTA_R2_URL }}
      PUERTA_R2_KEY: ${{ secrets.PUERTA_R2_KEY }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      ANDROID_AVD_HOME: /mnt/avd
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay historias pendientes?
        id: pend
        run: |
          python3 historias_nube.py --probar | tee probar.txt
          n=$(grep -oP 'pendientes: \K\d+' probar.txt || echo 0)
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: KVM y espacio
        if: steps.pend.outputs.n != '0'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          sudo mkdir -p /mnt/avd && sudo chown -R "$USER" /mnt/avd
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          df -h / /mnt

      - name: Imagen de Android (cache)
        if: steps.pend.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-34/google_apis_playstore/x86_64
            /usr/local/lib/android/sdk/emulator
          key: android34-playstore-x86_64-v1

      - name: Instalar emulador e imagen
        if: steps.pend.outputs.n != '0'
        run: |
          SM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SM --licenses >/dev/null || true
          [ -d "$ANDROID_SDK_ROOT/system-images/android-34/google_apis_playstore/x86_64" ] || \
            $SM "system-images;android-34;google_apis_playstore;x86_64" >/dev/null
          [ -x "$ANDROID_SDK_ROOT/emulator/emulator" ] || $SM "emulator" >/dev/null
          $SM "platform-tools" >/dev/null

      - name: Armar el emulador (copia del de la PC)
        if: steps.pend.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=/mnt/avd/eugenia_ig.avd; mkdir -p $D /mnt/dl
          gh release download avd -R ${{ github.repository }} -D /mnt/dl
          cat /mnt/dl/userdata.part0 /mnt/dl/userdata.part1 /mnt/dl/userdata.part2 > $D/userdata-qemu.img
          rm -f /mnt/dl/userdata.part*
          tar -xzf /mnt/dl/avd-chico.tgz -C $D
          sed -i 's#\\#/#g' $D/config.ini
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-34\n' "$D" > /mnt/avd/eugenia_ig.ini
          ls -la $D

      - name: Prender el emulador
        if: steps.pend.outputs.n != '0'
        run: |
          nohup $ANDROID_SDK_ROOT/emulator/emulator -avd eugenia_ig -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 2 > emulador.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          adb shell getprop sys.boot_completed
          sleep 20
          adb shell input keyevent 82

      - name: Historias
        if: steps.pend.outputs.n != '0'
        run: python3 historias_nube.py

      - name: Guardar lo hecho
        if: always()
        run: |
          git config user.name "eugenia-historias"
          git config user.email "eugenia-historias@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -q -m "historias $(date -u +%F' '%H:%M)" && git push -q)

      - name: Capturas y log si algo falló
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historias-${{ github.run_id }}
          path: |
            falla_*.png
            emulador.log
          retention-days: 7
          if-no-files-found: ignore
